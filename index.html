<!Zafra>
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zafra - Biashara Afrika</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #183c2b;
    }

    header {
      background: #087443;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 34px;
      margin: 0;
    }

    header p {
      margin-bottom: 0;
    }

    main {
      padding: 22px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000012;
    }

    .welcome h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #087443;
      color: white;
      font-size: 16px;
    }

    .login {
      background: #e1eee6;
      color: #087443;
    }

    .section {
      background: white;
      margin-top: 18px;
      padding: 18px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>ZAFRA</h1>
    <p>Biashara yako, soko kubwa zaidi Afrika.</p>
  </header>

  <main>
    <div class="welcome">
      <h2>Karibu Zafra!</h2>
      <p>Gundua bidhaa, pata huduma na ungana na wafanyabiashara kwa urahisi.</p>

      <button onclick="alert('Usajili utaongezwa hatua inayofuata!')">
        Jisajili
      </button>

      <button class="login"
        onclick="alert('Kuingia kutaongezwa hatua inayofuata!')">
        Ingia
      </button>
    </div>

    <div class="section">
      <h3>🛍️ Bidhaa</h3>
      <p>Hapa tutaonyesha bidhaa zinazouzwa na wafanyabiashara.</p>
    </div>

    <div class="section">
      <h3>🏪 Biashara</h3>
      <p>Hapa wateja wataweza kupata biashara na huduma mbalimbali.</p>
    </div>
  </main>
</body>
</html>
